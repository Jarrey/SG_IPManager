# This file is a reference only. At runtime, start.sh dynamically generates
# /etc/nginx/nginx.conf based on environment variables (HTTP_PORT, HTTPS_PORT,
# SSL_CERT_PATH, SSL_KEY_PATH). Set these in your .env file.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # HTTP server (default port: 8080)
    server {
        listen 8080;
        server_name localhost;
        root /var/www/html;
        index index.php index.html;

        # Deny direct access to data directory
        location ^~ /data/ {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
        }

        location ~ /\. {
            deny all;
        }
    }

    # HTTPS server (enabled when HTTPS_PORT is set and SSL files exist)
    # server {
    #     listen 8443 ssl;
    #     http2 on;
    #     server_name localhost;
    #     root /var/www/html;
    #     index index.php index.html;
    #
    #     ssl_certificate     /etc/nginx/ssl/server.crt;
    #     ssl_certificate_key /etc/nginx/ssl/server.key;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # }
}
